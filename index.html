<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Our photo gallery — a collection of our most precious moments together.">
  <title>Us — Our Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Floating hearts background -->
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <div class="nav-logo">♡ Us</div>
      <div class="nav-links">
        <a href="#hero">Home</a>
        <a href="#gallery">Gallery</a>
      </div>
    </div>
  </nav>

  <!-- ==================== HERO ==================== -->
  <section id="hero" class="hero">
    <div class="hero-content">
      <p class="hero-eyebrow">— a love story —</p>
      <h1 class="hero-title">Our <em>Story</em></h1>
      <p class="hero-subtitle">Every laugh, every look, every moment — collected here with love.</p>

      <div class="hero-names">
        <span class="hero-name" id="hero-name1">Diar</span>
        <span class="hero-heart" aria-hidden="true">♥</span>
        <span class="hero-name" id="hero-name2">Your Love</span>
      </div>

      <div class="days-counter">
        <div class="counter-box">
          <div class="counter-units">
            <div class="counter-unit">
              <span class="counter-num" id="cnt-days">0</span>
              <span class="counter-label">days</span>
            </div>
            <div class="counter-sep" aria-hidden="true">:</div>
            <div class="counter-unit">
              <span class="counter-num" id="cnt-hours">00</span>
              <span class="counter-label">hours</span>
            </div>
            <div class="counter-sep" aria-hidden="true">:</div>
            <div class="counter-unit">
              <span class="counter-num" id="cnt-minutes">00</span>
              <span class="counter-label">mins</span>
            </div>
            <div class="counter-sep" aria-hidden="true">:</div>
            <div class="counter-unit">
              <span class="counter-num" id="cnt-seconds">00</span>
              <span class="counter-label">secs</span>
            </div>
          </div>
          <span class="counter-tagline">together and counting ♥</span>
        </div>
      </div>

      <a href="#gallery" class="hero-cta">See Our Moments</a>
    </div>

    <div class="scroll-indicator" aria-hidden="true">
      <div class="scroll-line"></div>
      <span>scroll</span>
    </div>
  </section>

  <!-- ==================== GALLERY ==================== -->
  <section id="gallery" class="gallery-section">
    <div class="section-header">
      <h2>Our <em>Moments</em></h2>
      <p>Hover to reveal the story — click to dive in</p>
    </div>
    <div class="gallery-grid" id="gallery-grid">
      <!-- Rendered by JavaScript -->
    </div>
  </section>

  <!-- ==================== LIGHTBOX ==================== -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
    <button class="lb-close" id="lb-close" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>

    <div class="lb-inner">
      <!-- Photo -->
      <div class="lb-photo-wrap">
        <div class="lb-loader" id="lb-loader" aria-hidden="true"></div>
        <img id="lb-img" src="" alt="">
      </div>

      <!-- Info panel -->
      <div class="lb-panel">
        <div class="lb-meta">
          <span class="lb-location" id="lb-location"></span>
          <span class="lb-date-badge" id="lb-date"></span>
        </div>

        <h3 class="lb-title" id="lb-title"></h3>
        <p class="lb-story" id="lb-story"></p>

        <!-- Action bar -->
        <div class="lb-actions">
          <button class="act-btn act-like" id="lb-like">
            <span class="like-heart" id="lb-heart" aria-hidden="true">♥</span>
            <span id="lb-like-count">0</span>
          </button>
          <button class="act-btn act-share" id="lb-share">
            <span aria-hidden="true">&#8599;</span> Share
          </button>
          <button class="act-btn act-download" id="lb-download">
            <span aria-hidden="true">&#8595;</span> Save
          </button>
        </div>

        <!-- Comments -->
        <div class="lb-comments">
          <div class="comments-header">
            <span class="comments-title">Comments</span>
            <span class="comments-badge" id="comments-badge">0</span>
          </div>

          <div class="comments-list" id="comments-list" aria-live="polite"></div>

          <div class="comment-form">
            <input
              type="text"
              id="comment-name"
              placeholder="Your name"
              maxlength="40"
              autocomplete="given-name"
            >
            <textarea
              id="comment-text"
              placeholder="Write something sweet... 💕"
              maxlength="300"
              rows="3"
            ></textarea>
            <button class="comment-submit" id="comment-submit">Post ♥</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
